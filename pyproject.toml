
[project]
name = "constrained_diffusion"
version = "1.2.5"
description = "Constrained diffusion decomposition: Diffusion-based Multi-Scale Analysis of Complex Iages"
readme = "README.md"
requires-python = ">=3.0"
license = { file = "LICENSE" }
authors = [
    { name = "Guang-Xing Li", email = "ligx.ngc7293@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.00",
    "scipy>=1.0",
    "astropy>=5.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0",
    "monai>=1.3",
]

[project.scripts]
cdd-fits-decompose = "morph_informed_decomposition:main"
cdd-morpho-decompose = "morph_informed_decomposition:main"
cdd-estimate-channel-scales = "utils:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["constrained_diffusion", "morph_informed_decomposition", "utils", "chunking"]


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://gxli.github.io/Constrained-Diffusion-Decomposition/"
